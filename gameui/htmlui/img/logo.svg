<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="SourceSpeedrunMod">
  <title>SourceSpeedrunMod</title>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4fb8ff"/>
      <stop offset="1" stop-color="#9fdcff"/>
    </linearGradient>
  </defs>

  <!-- speed lines -->
  <g stroke="#8fd3ff" stroke-linecap="round">
    <line x1="6" y1="58" x2="30" y2="58" stroke-width="6"/>
    <line x1="14" y1="74" x2="28" y2="74" stroke-width="6" opacity="0.75"/>
    <line x1="20" y1="90" x2="32" y2="90" stroke-width="6" opacity="0.5"/>
  </g>

  <!-- stopwatch crown and side button -->
  <rect x="55" y="8" width="22" height="9" rx="3" fill="#ffffff"/>
  <rect x="62" y="15" width="8" height="10" rx="2" fill="#ffffff"/>
  <rect x="98" y="24" width="10" height="7" rx="2" fill="#ffffff" transform="rotate(45 103 27.5)"/>

  <!-- dial: open ring for motion -->
  <circle cx="68" cy="72" r="42" fill="#05070a" fill-opacity="0.55"/>
  <circle cx="68" cy="72" r="42" fill="none" stroke="url(#ring)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="230 34" transform="rotate(-62 68 72)"/>

  <!-- ticks -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="68" y1="38" x2="68" y2="44"/>
    <line x1="102" y1="72" x2="96" y2="72"/>
    <line x1="68" y1="106" x2="68" y2="100"/>
  </g>

  <!-- hand: a forward chevron, the "speed" in speedrun -->
  <path d="M60 52 L84 72 L60 92" fill="none" stroke="url(#hand)" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="68" cy="72" r="5" fill="#ffffff"/>
</svg>
